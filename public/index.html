<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <title>Alunos</title>
</head>

<body>

    <h1>Alunos</h1>

    <div class="barra-topo">
        <button id="idCriarAluno">Criar Aluno</button>
        <button id="idCriarCurso">Criar Curso</button>
    </div>

    <h2>Lista de Alunos</h2>

    <table>
        <thead>
            <tr>
                <th>Nome</th>
                <th>Apelido</th>
                <th>Curso</th>
                <th>Ano Curricular</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody id="alunos"></tbody>
    </table>

    <!-- MODAL: CRIAR / EDITAR ALUNO -->
    <dialog id="modalAluno">
        <h2 id="tituloModalAluno">Criar Aluno</h2>

        <form id="formCriar">
            <label for="nome">Nome Aluno:</label>
            <input type="text" id="nome" placeholder="Nome do aluno" required>

            <label for="apelido">Apelido Aluno:</label>
            <input type="text" id="apelido" placeholder="Apelido do aluno" required>

            <label for="idCurso">Curso:</label>
            <select id="idCurso" required>
                <option value="">Seleciona um curso</option>
            </select>

            <label for="anoCurricular">Ano Curricular:</label>
            <input type="number" id="anoCurricular" placeholder="Ano curricular" min="1" required>

            <div class="botoes-modal">
                <button type="button" id="btcriar">Criar Aluno</button>
                <button type="button" id="btCancelarEdicao">Cancelar</button>
            </div>
        </form>
    </dialog>

    <!-- MODAL: CRIAR CURSO -->
    <dialog id="modalCurso">
        <h2>Criar Curso</h2>

        <form id="formCriarCurso">
            <label for="nomeCurso">Nome do Curso:</label>
            <input type="text" id="nomeCurso" placeholder="Nome do curso" required>

            <label for="coordenador">Coordenador:</label>
            <input type="text" id="coordenador" placeholder="Coordenador" required>

            <div class="botoes-modal">
                <button type="button" id="btcriarCurso">Criar Curso</button>
                <button type="button" id="btCancelarCurso">Cancelar</button>
            </div>
        </form>
    </dialog>

</body>
</html>
